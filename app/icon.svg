<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- NVBC: the lime ball from the site header, on the club's dark green. -->
  <defs>
    <clipPath id="ball"><circle cx="32" cy="32" r="23"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0d4f30"/>
  <circle cx="32" cy="32" r="23" fill="#d7ef3a"/>
  <!-- soft shade on the lower right -->
  <circle cx="40" cy="40" r="23" fill="#000" fill-opacity=".12" clip-path="url(#ball)"/>
  <circle cx="32" cy="32" r="23" fill="#d7ef3a" clip-path="url(#ball)" transform="translate(-3 -3)"/>
  <!-- ball holes -->
  <g fill="#0d4f30" fill-opacity=".45">
    <circle cx="32" cy="32" r="3.4"/>
    <circle cx="32" cy="19.5" r="3"/>
    <circle cx="42.8" cy="25.8" r="3"/>
    <circle cx="42.8" cy="38.2" r="3"/>
    <circle cx="32" cy="44.5" r="3"/>
    <circle cx="21.2" cy="38.2" r="3"/>
    <circle cx="21.2" cy="25.8" r="3"/>
  </g>
</svg>
